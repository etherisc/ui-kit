name: Compliance Check (Nightly)

on:
  pull_request:
    branches: [develop]
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check mode'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline
          - diff
      tier:
        description: 'Tier filter (empty = all)'
        required: false
        type: choice
        options:
          - ''
          - static
          - structural
          - semantic

permissions:
  contents: write
  issues: write

jobs:
  compliance:
    uses: etherisc-saas/saas-architecture/.github/workflows/compliance-reusable.yml@develop
    with:
      event_name: ${{ github.event_name }}
      pr_base_ref: ${{ github.base_ref || 'develop' }}
      mode: ${{ inputs.mode || 'baseline' }}
      tier: ${{ inputs.tier || '' }}
      self_hosted_entities: 'false'
    secrets:
      SAAS_ARCH_TOKEN: ${{ secrets.SAAS_ARCH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
