# Compliance configuration for ui-kit (React component library)
#
# Entity source: auto-detected from sibling saas-architecture/,
#   or set COMPLIANCE_ENTITY_SOURCE env var for CI.

# UI library — only platform and devops rules apply.
# No infrastructure or business logic in UI components.
component_id: COMP-PFM-008
archetype: ui-monorepo
domains: [PFM, DVO, GOV]

ignore_paths:
  - "dist/**"
  - "node_modules/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.stories.tsx"
  - "coverage/**"
  - "docs/**"
  - ".github/**"
  - ".storybook/**"
  - ".devcontainer/**"

exclude:
  - CON-PFM-010  # redundant with CON-GOV-005 allowlist
  - CON-GOV-001  # node-ts single app structure — ui-kit is a monorepo
  - CON-GOV-008  # platform-sdk monorepo structure — not applicable
  - CON-GOV-013  # architecture repo structure — only saas-architecture
  - CON-GOV-014  # app monorepo structure — ui-kit is a library monorepo
  - CON-GOV-017  # uses node-ts-app structure template — wrong archetype

suppress:
  - entity: CON-DVO-002
    file: "packages/showcase/**"
    reason: "Showcase is a demo app, not a production system"
  - entity: CON-PFM-001
    file: "packages/showcase/**"
    reason: "Showcase is a demo app, no tenant isolation needed"
  - entity: CON-PFM-009
    file: "packages/showcase/**"
    reason: "Showcase is a demo app, API conventions not required"

overrides:
  CON-GOV-005:
    allowlist_ref: templates/allowlists/react-ui-packages.yaml
