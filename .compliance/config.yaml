# Compliance configuration for ui-kit (React component library)
#
# Entity source: auto-detected from sibling saas-architecture/,
#   or set COMPLIANCE_ENTITY_SOURCE env var for CI.

# UI library — only platform and devops rules apply.
# No infrastructure or business logic in UI components.
domains: [PFM, DVO]

ignore_paths:
  - "dist/**"
  - "node_modules/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.stories.tsx"
  - "coverage/**"
  - "docs/**"
  - ".github/**"
  - ".storybook/**"
  - ".devcontainer/**"

# Suppress database-related rules for the showcase app.
# The showcase uses a minimal SQLite DB for demo/testing purposes only;
# it is not a production system and does not require tenant isolation,
# role separation, or MFA enforcement.
suppressions:
  - rule: CON-DVO-002
    paths:
      - "packages/showcase/src/database/**"
      - "packages/showcase/src/types/**"
    reason: "Showcase DB is for testing/demo only, not a production system"
  - rule: CON-PFM-001
    paths:
      - "packages/showcase/src/database/**"
      - "packages/showcase/src/types/**"
    reason: "Showcase DB is for testing/demo only, no tenant isolation needed"
